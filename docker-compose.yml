services:
  backend:
    build: .
    container_name: bookstore-backend
    ports:
      - "8080:8080"
    # Load ALL vars from .env into the container: DB/Neon (DB_URL_PROD, DB_USERNAME_PROD,
    # DB_PASSWORD_PROD), plus APP_JWT_SECRET, CLOUDINARY_*, VNPAY_*, AI_API_KEY, MAIL_*.
    # The prod profile requires these — missing ones would fail startup on placeholder resolution.
    env_file:
      - .env
    environment:
      # Force the prod profile regardless of the dev default in .env (this overrides env_file).
      SPRING_PROFILES_ACTIVE: prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
